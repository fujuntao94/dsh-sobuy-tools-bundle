- insert:
    # 一个 Sobuy 工具包内聚合独立组件；每个组件仍可在 Desktop 中单独启停。
    # 根组件同时加载飞书能力与 client 设置页，避免目录中出现单独的 client 组件。
    - id: sobuy-feishu-tools
      name: dsh-sobuy-tools-bundle
      config:
        callbackHost: 127.0.0.1
        callbackPort: 18080
        callbackPath: /feishu/callback
        setupPath: /feishu/setup
        statusPath: /feishu/status
        oauthScope: offline_access contact:user.base:readonly contact:user.department:readonly contact:department.base:readonly
        setupPort: 18081
        authorizationTimeoutMs: 300000
    - id: sobuy-database-tools
      name: dsh-sobuy-tools-bundle/database
      config:
        setupHost: 127.0.0.1
        setupPort: 18082
        setupPath: /database/setup
        statusPath: /database/status
