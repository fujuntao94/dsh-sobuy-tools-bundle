- insert:
    # 一个 Sobuy 工具包内聚合独立组件；每个组件仍可在 Desktop 中单独启停。
    # 飞书与数据库都作为总包下可独立启停的子组件。
    - id: sobuy-feishu-tools
      name: sobuy-feishu-tools
      config:
        callbackHost: 127.0.0.1
        callbackPort: 18080
        callbackPath: /feishu/callback
        oauthScope: offline_access contact:user.base:readonly contact:user.department:readonly contact:department.base:readonly
        authorizationTimeoutMs: 300000
    - id: sobuy-database-tools
      name: sobuy-database-tools
