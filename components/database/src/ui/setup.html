<!doctype html><!-- 数据库浏览器设置页模板 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>设置数据库连接</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px 16px; color: #172033; background: linear-gradient(145deg, #edf4ff, #f8fbff 45%, #eef8ff); }
      main { width: min(100%, 520px); overflow: hidden; border: 1px solid #dce6f7; border-radius: 20px; background: #fff; box-shadow: 0 20px 55px rgba(34, 74, 135, .16); }
      header { padding: 30px 32px 26px; color: #fff; background: linear-gradient(135deg, #4a8dff, #2864e7); }
      .logo { display: grid; place-items: center; width: 42px; height: 42px; margin-bottom: 16px; border-radius: 12px; background: rgba(255,255,255,.18); font-size: 22px; font-weight: 700; }
      h1 { margin: 0 0 8px; font-size: 23px; } header p { margin: 0; line-height: 1.65; color: rgba(255,255,255,.84); font-size: 14px; }
      form { padding: 24px 32px 30px; } label { display: block; margin: 0 0 8px; color: #283449; font-size: 14px; font-weight: 650; }
      input, textarea { width: 100%; padding: 0 13px; border: 1px solid #ccd9ef; border-radius: 10px; outline: none; color: #172033; font: inherit; }
      input { height: 46px; } textarea { min-height: 92px; padding-top: 11px; resize: vertical; line-height: 1.55; }
      input:focus, textarea:focus { border-color: #3370ff; box-shadow: 0 0 0 3px rgba(51,112,255,.15); }
      .field { margin-top: 20px; } .row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(110px, 1fr); gap: 14px; }
      h2 { margin: 30px 0 0; padding-top: 24px; border-top: 1px solid #e6edf8; color: #263a59; font-size: 17px; }
      .hint { margin: 8px 0 0; color: #718096; font-size: 12px; line-height: 1.6; }
      .status, .notice { margin: 20px 32px 0; padding: 12px 13px; border: 1px solid #cfe0ff; border-radius: 10px; background: #f3f7ff; color: #52627a; font-size: 13px; line-height: 1.55; }
      .status strong { display: block; margin-bottom: 3px; color: #263a59; } .status.success { border-color: #a9e6c4; background: #effcf5; } .status.success strong { color: #16794a; }
      .notice.error { border-color: #fecdca; color: #b42318; background: #fff1f0; } .notice.success { border-color: #a9e6c4; color: #16794a; background: #effcf5; } .notice[hidden] { display: none; }
      .check { display: flex; align-items: center; gap: 9px; margin-top: 20px; font-weight: 500; } .check input { width: 17px; height: 17px; }
      button { width: 100%; height: 48px; margin-top: 26px; border: 0; border-radius: 10px; color: #fff; background: linear-gradient(135deg, #4c8dff, #2864e7); box-shadow: 0 8px 18px rgba(51,112,255,.25); cursor: pointer; font: 600 15px inherit; }
      button:hover { filter: brightness(1.04); } footer { padding: 0 32px 26px; color: #718096; font-size: 12px; line-height: 1.65; }
      @media (max-width: 460px) { .row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <header><div class="logo">库</div><h1>设置数据库连接</h1><p>连接信息只提交给本机插件服务。请使用权限受限的只读数据库账号。</p></header>
      <div class="status" id="status"><strong id="status-title">正在读取已保存状态…</strong><span id="status-detail">请稍候。</span></div>
      <p class="notice {{noticeTone}}" {{noticeHidden}}>{{message}}</p>
      <form method="post" action="{{setupPath}}">
        <input type="hidden" name="setup_token" value="{{setupToken}}">
        <div class="row">
          <div><label for="host">主机</label><input id="host" name="host" required autocomplete="off" placeholder="127.0.0.1"></div>
          <div><label for="port">端口</label><input id="port" name="port" required inputmode="numeric" value="3306"></div>
        </div>
        <div class="field"><label for="database">数据库名</label><input id="database" name="database" required autocomplete="off" placeholder="请输入数据库名"></div>
        <div class="field"><label for="username">用户名</label><input id="username" name="username" required autocomplete="username" placeholder="请输入只读账号"></div>
        <div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="请输入数据库密码"><p class="hint" id="password-hint">密码会以仅当前系统用户可读的权限保存在本机。</p></div>
        <label class="check"><input id="ssl" name="ssl" type="checkbox"> 使用 SSL 连接</label>
        <h2>查询安全策略</h2>
        <div class="field"><label for="allowed-tables">业务表白名单</label><textarea id="allowed-tables" name="allowed_tables" placeholder="每行一个表名，例如：&#10;orders&#10;order_items"></textarea><p class="hint">留空表示禁止业务表查询；表清单元数据查询不受此项影响。</p></div>
        <div class="row field">
          <div><label for="max-rows">最大返回行数</label><input id="max-rows" name="max_rows" required inputmode="numeric" min="1" max="5000" value="500"></div>
          <div><label for="query-timeout-ms">查询超时（毫秒）</label><input id="query-timeout-ms" name="query_timeout_ms" required inputmode="numeric" min="500" max="60000" value="15000"></div>
        </div>
        <div class="field"><label for="sensitive-fields">敏感字段规则</label><textarea id="sensitive-fields" name="sensitive_fields" placeholder="每行一个字段关键词"></textarea><p class="hint">匹配字段会统一返回 [REDACTED]；留空时恢复安全默认规则。</p></div>
        <button type="submit" id="submit-button">保存数据库配置</button>
      </form>
      <footer>保存时不会连接数据库；调用表清单能力时才会执行只读元数据查询。</footer>
    </main>
    <script>
      // 状态接口只返回可展示字段，绝不返回数据库密码。
      const statusBox = document.getElementById('status')
      const statusTitle = document.getElementById('status-title')
      const statusDetail = document.getElementById('status-detail')
      const host = document.getElementById('host')
      const port = document.getElementById('port')
      const database = document.getElementById('database')
      const username = document.getElementById('username')
      const password = document.getElementById('password')
      const passwordHint = document.getElementById('password-hint')
      const ssl = document.getElementById('ssl')
      const allowedTables = document.getElementById('allowed-tables')
      const maxRows = document.getElementById('max-rows')
      const queryTimeoutMs = document.getElementById('query-timeout-ms')
      const sensitiveFields = document.getElementById('sensitive-fields')
      fetch('{{statusPath}}', { cache: 'no-store' }).then(response => {
        if (!response.ok) throw new Error('status request failed')
        return response.json()
      }).then(status => {
        if (!status.configured) {
          statusTitle.textContent = '尚未配置数据库'
          statusDetail.textContent = '请填写订单数据库连接信息并保存。'
          return
        }
        host.value = status.host || ''
        port.value = status.port || 3306
        database.value = status.database || ''
        username.value = status.username || ''
        ssl.checked = Boolean(status.ssl)
        allowedTables.value = (status.allowedTables || []).join('\n')
        maxRows.value = status.maxRows || 500
        queryTimeoutMs.value = status.queryTimeoutMs || 15000
        sensitiveFields.value = (status.sensitiveFields || []).join('\n')
        password.placeholder = '已安全保存；留空表示不修改'
        passwordHint.textContent = '如不更换密码，可留空。'
        statusBox.classList.add('success')
        statusTitle.textContent = '订单数据库配置已保存'
        const allowlist = status.allowedTables?.length ? `${status.allowedTables.length} 张白名单表` : '业务表查询默认禁止'
        statusDetail.textContent = `${status.username}@${status.host}:${status.port}/${status.database}；${allowlist}`
      }).catch(() => {
        statusTitle.textContent = '无法读取已保存状态'
        statusDetail.textContent = '请确认 Sobuy 数据库组件正在运行后刷新页面。'
      })
    </script>
  </body>
</html>
