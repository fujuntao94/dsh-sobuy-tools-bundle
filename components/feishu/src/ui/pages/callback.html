<!doctype html><!-- OAuth 回调结果页模板 -->
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{title}}</title>
<style>
  :root {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    color: #172033;
    background: #f5f7fb;
  }

  * {
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 12% 5%, #e9f0ff 0, transparent 34%), radial-gradient(circle at 92% 94%, #e5faf3 0, transparent 30%), #f5f7fb;
  }

  .card {
    width: min(100%, 440px);
    padding: 40px 36px;
    border: 1px solid rgba(28, 58, 105, .09);
    border-radius: 24px;
    background: rgba(255, 255, 255, .94);
    box-shadow: 0 24px 64px rgba(32, 61, 109, .14);
    text-align: center;
  }

  .badge {
    display: grid;
    place-items: center;
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    border-radius: 22px;
  }

  body[data-tone="success"] .badge {
    background: linear-gradient(135deg, #4b91ff, #2766e8);
    box-shadow: 0 12px 24px rgba(51, 112, 255, .25);
  }

  body[data-tone="error"] .badge {
    background: linear-gradient(135deg, #f79009, #dc6803);
    box-shadow: 0 12px 24px rgba(220, 104, 3, .22);
  }

  svg {
    width: 34px;
    height: 34px;
    fill: none;
    stroke: #fff;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  h1 {
    margin: 0;
    color: #101828;
    font-size: 26px;
    letter-spacing: -.03em;
  }

  p {
    margin: 13px 0 0;
    color: #667085;
    font-size: 15px;
    line-height: 1.7;
  }

  .close-hint {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid #eaecf0;
    color: #98a2b3;
    font-size: 13px;
  }

  .close-hint strong {
    color: #475467;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 480px) {
    body {
      padding: 16px;
    }

    .card {
      padding: 32px 24px;
      border-radius: 20px;
    }
  }
</style>

<body data-tone="{{tone}}" data-auto-close-seconds="{{autoCloseSeconds}}">
  <main class="card" role="status">
    <div class="badge">{{icon}}</div>
    <h1>{{title}}</h1>
    <p>{{detail}}</p>
    <p class="close-hint" id="close-hint">
      <span id="close-prefix"></span><strong id="countdown" hidden></strong><span id="close-suffix"></span>
    </p>
  </main>
  <script>
    const seconds = Number(document.body.dataset.autoCloseSeconds)
    const prefix = document.getElementById('close-prefix')
    const countdown = document.getElementById('countdown')
    const suffix = document.getElementById('close-suffix')
    if (!seconds) {
      prefix.textContent = '请返回 DeepSeek Harness 后重新操作'
    } else {
      prefix.textContent = '此页面将在 '
      countdown.hidden = false
      suffix.textContent = ' 秒后自动关闭'
      let remaining = seconds
      countdown.textContent = remaining
      const timer = setInterval(() => {
        remaining -= 1
        countdown.textContent = remaining
        if (remaining === 0) clearInterval(timer)
      }, 1000)
      setTimeout(() => {
        window.close()
        // 普通浏览器标签可能禁止脚本关闭；此时明确提示用户授权已结束。
        setTimeout(() => {
          if (!window.closed) {
            prefix.textContent = '授权已完成，可以关闭此页面'
            countdown.hidden = true
            suffix.textContent = ''
          }
        }, 250)
      }, seconds * 1000)
    }
  </script>
</body>

</html>
