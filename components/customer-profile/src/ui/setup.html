<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户画像数据源</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;padding:20px}main{width:min(100%,520px);background:#fff;border-radius:16px;box-shadow:0 16px 42px #18335420;overflow:hidden}header{padding:28px 30px;background:#5747d9;color:#fff}h1{margin:0 0 8px;font-size:22px}header p{margin:0;line-height:1.6;font-size:14px;opacity:.88}form{padding:24px 30px}label{display:block;font-size:14px;font-weight:650;margin:18px 0 7px}.row{display:grid;grid-template-columns:2fr 1fr;gap:12px}input{width:100%;height:44px;padding:0 12px;box-sizing:border-box;border:1px solid #cad4e5;border-radius:9px;font:inherit}.check{display:flex;gap:8px;align-items:center;font-weight:400}.check input{width:16px;height:16px}.hint,.status,.notice,footer{font-size:12px;line-height:1.6;color:#68758a}.status,.notice{margin:20px 30px 0;padding:11px 12px;border-radius:9px;background:#f3f5ff}.notice.error{background:#fff0ef;color:#b42318}.notice.success{background:#effbf4;color:#16794a}.notice[hidden]{display:none}button{width:100%;height:46px;margin-top:25px;border:0;border-radius:9px;background:#5747d9;color:#fff;font:600 15px inherit;cursor:pointer}footer{padding:0 30px 24px}@media(max-width:460px){.row{grid-template-columns:1fr}}</style></head><body><main><header><h1>客户画像数据源</h1><p>先配置一个主数据源；后续可增加 CRM、客服、营销等独立数据源。</p></header><div class="status" id="status">正在读取已保存状态…</div><p class="notice {{noticeTone}}" {{noticeHidden}}>{{message}}</p><form method="post" action="{{setupPath}}"><input type="hidden" name="setup_token" value="{{setupToken}}"><label for="source-name">数据源名称</label><input id="source-name" name="source_name" value="OMS 主数据源"><div class="row"><div><label for="host">主机</label><input id="host" name="host" required autocomplete="off"></div><div><label for="port">端口</label><input id="port" name="port" required value="3306"></div></div><label for="database">数据库名</label><input id="database" name="database" required><label for="username">只读用户名</label><input id="username" name="username" required><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="new-password"><p class="hint" id="password-hint">密码仅保存在当前系统用户的本机私有目录。</p><label class="check"><input id="ssl" name="ssl" type="checkbox">使用 SSL 连接</label><button>保存主数据源</button></form><footer>保存不会连接数据库。该独立组件不会读取 OMS 数据库组件的配置或凭据。</footer></main><script>const $=id=>document.getElementById(id);fetch('{{statusPath}}',{cache:'no-store'}).then(r=>r.json()).then(s=>{if(!s.configured){$('status').textContent='尚未配置客户画像数据源';return}const x=s.sources[0];$('source-name').value=x.name;$('host').value=x.host;$('port').value=x.port;$('database').value=x.database;$('username').value=x.username;$('ssl').checked=x.ssl;$('password').placeholder='已安全保存；留空表示不修改';$('password-hint').textContent='已保存主数据源；后续可增加 CRM、客服等数据源。';$('status').textContent=`已保存：${x.name}（${x.type}）`}).catch(()=>{$('status').textContent='无法读取状态；请确认客户画像组件正在运行。'})</script></body></html>
